name: Rusty MaNGOS Launcher Installer

on:
  workflow_dispatch:
  schedule:
    # Build a fresh Windows launcher installer every Sunday at 07:30 UTC.
    - cron: "30 7 * * 0"
  push:
    branches:
      - codex/rusty-mangos
    paths:
      - ".github/workflows/rusty-mangos-launcher.yml"
      - "bins/rusty-mangos-launcher/**"
      - "bins/authserver/**"
      - "bins/worldserver/**"
      - "crates/**"
      - "docs/rusty_mangos_launcher.md"
      - "installer/**"
      - "scripts/package-rusty-mangos-launcher.ps1"
      - "scripts/rusty-mangos-launcher.*"
      - "sql/base/**"
      - "sql/updates/mangos/**"
      - "Cargo.toml"
      - "Cargo.lock"

permissions:
  contents: write

jobs:
  build-installer:
    name: Build Windows installer
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Boost
        shell: pwsh
        run: choco install boost-msvc-14.3 -y --no-progress

      - name: Build launcher installer
        shell: pwsh
        run: .\scripts\package-rusty-mangos-launcher.ps1

      - name: Upload installer
        uses: actions/upload-artifact@v6
        with:
          name: RustyMangosSetup
          path: target\launcher-package\installer\RustyMangosSetup.exe
          if-no-files-found: error

      - name: Upload packaged app folder
        uses: actions/upload-artifact@v6
        with:
          name: RustyMangosApp
          path: target\launcher-package\app
          if-no-files-found: error

      - name: Upload checksums
        uses: actions/upload-artifact@v6
        with:
          name: RustyMangosChecksums
          path: target\launcher-package\installer\SHA256SUMS.txt
          if-no-files-found: error

      - name: Zip packaged app for release
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path target\launcher-package\app\* `
            -DestinationPath target\launcher-package\installer\RustyMangosApp.zip `
            -Force
          $hash = Get-FileHash -LiteralPath target\launcher-package\installer\RustyMangosApp.zip -Algorithm SHA256
          Add-Content `
            -LiteralPath target\launcher-package\installer\SHA256SUMS.txt `
            -Value ("{0}  {1}" -f $hash.Hash.ToLowerInvariant(), "RustyMangosApp.zip")

      - name: Publish rolling launcher release
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "launcher-nightly"
          $title = "Rusty MaNGOS Launcher Nightly"
          $notes = @"
          Automated launcher installer build from $env:GITHUB_REF_NAME.

          Commit: $env:GITHUB_SHA
          Run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID
          "@

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete $tag --cleanup-tag --yes --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

          gh release create $tag `
            "target\launcher-package\installer\RustyMangosSetup.exe#RustyMangosSetup.exe" `
            "target\launcher-package\installer\RustyMangosApp.zip#RustyMangosApp.zip" `
            "target\launcher-package\installer\SHA256SUMS.txt#SHA256SUMS.txt" `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title $title `
            --notes $notes `
            --prerelease `
            --latest=false
