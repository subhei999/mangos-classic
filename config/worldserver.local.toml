# Local Docker-backed worldserver skeleton configuration.

bind_address = "127.0.0.1"
bind_port = 8085
data_dir = "C:/World of Warcraft Classic"

[login_database]
host = "127.0.0.1"
port = 3307
user = "mangos"
password = "mangos"
database = "realmd"

[world_database]
host = "127.0.0.1"
port = 3307
user = "mangos"
password = "mangos"
database = "mangos"

[character_database]
host = "127.0.0.1"
port = 3307
user = "mangos"
password = "mangos"
database = "characters"

[world]
# CMaNGOS reference: mangosd.conf MapUpdateInterval, in milliseconds.
MapUpdateInterval = 100
char_delete_method = 0
char_delete_min_level = 0

[playerbots]
# Disabled for normal local starts so real-client multiplayer testing is not
# polluted by synthetic player actors. Use restart-game-stack.ps1
# -EnablePlayerbots for explicit bot load tests, or
# scripts/start-playerbot-idle-perf.ps1 for the release 500-bot idle benchmark.
enabled = false
combat_enabled = true
force_active = false

[playerbots.random]
enabled = false
count = 0
start_guid = 9010000
name_prefix = "Loadbot"
race = 1
class = 1
gender = 0
level = 1
map = 0
center_x = -8949.0
center_y = -132.0
center_z = 83.5
radius = 80.0
distribution = "radius"
seed = 42

[playerbots.travel]
