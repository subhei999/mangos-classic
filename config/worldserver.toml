# ============================================================================
# CMaNGOS Rust -- World Server Configuration
# ============================================================================
# Runtime settings for the world server.
# Override any value with environment variables prefixed WORLD_
# (use double-underscore for nested keys, e.g. WORLD_WORLD__MAP_UPDATE_INTERVAL_MS).
# ============================================================================

# Address and port the world server listens on.
bind_address = "0.0.0.0"
bind_port = 8085

# Path to extracted Classic data files: maps, vmaps, mmaps, and DBC-derived data.
data_dir = "./data"

# --------------------------------------------------------------------------
# Realmd / auth database connection
# --------------------------------------------------------------------------
[login_database]
host     = "127.0.0.1"
port     = 3306
user     = "mangos"
password = "mangos"
database = "realmd"

# --------------------------------------------------------------------------
# World database connection
# --------------------------------------------------------------------------
[world_database]
host     = "127.0.0.1"
port     = 3306
user     = "mangos"
password = "mangos"
database = "mangos"

# --------------------------------------------------------------------------
# Character database connection
# --------------------------------------------------------------------------
[character_database]
host     = "127.0.0.1"
port     = 3306
user     = "mangos"
password = "mangos"
database = "characters"

# --------------------------------------------------------------------------
# World runtime
# --------------------------------------------------------------------------
[world]
# CMaNGOS reference: mangosd.conf MapUpdateInterval, in milliseconds.
MapUpdateInterval = 100

# CMaNGOS-compatible character delete behavior.
char_delete_method = 0
char_delete_min_level = 0

# Experimental proof slice: route movement updates through a bounded per-map
# actor mailbox while still applying them against the existing MapRuntime mutex.
experimental_movement_actor = false
experimental_movement_actor_queue_capacity = 1024
experimental_movement_actor_max_batch_size = 64

# --------------------------------------------------------------------------
# Server-side playerbots
# --------------------------------------------------------------------------
[playerbots]
enabled = false
combat_enabled = true
force_active = false

# Optional deterministic local load-test swarm. These generated bots are
# appended to any explicit [[playerbots.bots]] entries when playerbots are
# enabled. Keep disabled in shared/default config.
# [playerbots.random]
# enabled = false
# count = 1027
# start_guid = 9010000
# name_prefix = "Loadbot"
# race = 1
# class = 1
# gender = 0
# level = 1
# map = 0
# center_x = -8949.0
# center_y = -132.0
# center_z = 83.5
# radius = 80.0
# distribution = "radius" # or "cell_scatter"/"grid_scatter" for deterministic wide scatter
# seed = 42

# Optional shared travel destination for all configured/generated bots. The
# local load-test config points Northshire bots at a Stormwind City Guard
# coordinate from the local world DB.
# [playerbots.travel]
# enabled = false
# map = 0
# x = -9095.620
# y = 422.026
# z = 92.0445
# radius = 0.0

# Example:
# [[playerbots.bots]]
# guid = 9000001
# name = "Northshirebot"
# race = 1
# class = 1
# gender = 0
# level = 1
# map = 0
# x = -8949.0
# y = -132.0
# z = 83.5
# orientation = 0.0

# --------------------------------------------------------------------------
# Observability
# --------------------------------------------------------------------------
[observability]
enabled = true
bind_address = "127.0.0.1"
bind_port = 9091
